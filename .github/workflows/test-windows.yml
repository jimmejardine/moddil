# Tests on Windows; the steps live in _test.yml. Every step calls tools/ci.py,
# which is also how CI runs locally (Windows and WSL).
name: test (Windows)

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    uses: ./.github/workflows/_test.yml
    with:
      os: windows-latest
