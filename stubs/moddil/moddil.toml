# The umbrella for the standard mods: it re-exports those written in Moddil (`mods/`), so a program
# names them as `moddil::net` and so on, and holds the signatures still to be written: the root
# capabilities, `io` and `runtime` (`mod.stub.1`). A function here may have no body, and calling
# one traps.
[mod]
name = "moddil"
edition = "2027"
stub = true

[dependencies]
collections = { path = "../../mods/collections" }
sync = { path = "../../mods/sync" }
rand = { path = "../../mods/rand" }
serde = { path = "../../mods/serde" }
net = { path = "../../mods/net" }
sim = { path = "../../mods/sim" }
