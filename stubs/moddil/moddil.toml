# The umbrella for the standard mods: it re-exports them (`mods/`), all written in Moddil now, so a
# program names them as `moddil::net`, `moddil::root` and so on.
[mod]
name = "moddil"
edition = "2027"

[dependencies]
collections = { path = "../../mods/collections" }
sync = { path = "../../mods/sync" }
rand = { path = "../../mods/rand" }
serde = { path = "../../mods/serde" }
net = { path = "../../mods/net" }
sim = { path = "../../mods/sim" }
runtime = { path = "../../mods/runtime" }
crypto = { path = "../../mods/crypto" }
num = { path = "../../mods/num" }
decimal = { path = "../../mods/decimal" }
gpu = { path = "../../mods/gpu" }
web = { path = "../../mods/web" }
